[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "answer-clip"
version = "0.1.0a1"
description = "Local CLI to search lecture/video transcripts and clip the matching moments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "lljk8187-coder" }]
keywords = ["asr", "transcript", "clip", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.0",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
answer-clip = "answer_clip.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/answer_clip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: hits real Whisper model download/inference (skip by default in CI)",
]
