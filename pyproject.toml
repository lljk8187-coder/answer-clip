[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "answer-clip"
version = "0.1.0"
description = "Local CLI to search lecture/video transcripts and clip the matching moments."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "lljk8187-coder" }]
keywords = ["asr", "transcript", "clip", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
embed = ["sentence-transformers>=3.0"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
answer-clip = "answer_clip.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/answer_clip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: real Whisper/embedding model download/inference (skip by default in CI)",
]

[tool.hatch.build.targets.wheel.force-include]
"src/answer_clip/web/templates" = "answer_clip/web/templates"
